# ==============================================================================
# Stealth Cam Command - Individual Buck Deep-Dive Dossier & Full Photo Gallery
# Replace <slot> with the buck profile slot number (1..8), e.g. buck-1
# ==============================================================================

title: Buck Dossier
path: buck-<slot>
subview: true
icon: mdi:deer
type: custom:grid-layout
layout:
  grid-template-columns: 400px 1fr
  grid-gap: 16px
  mediaquery:
    "(max-width: 950px)":
      grid-template-columns: 100%
cards:
  # ============================================================================
  # Left Column: Navigation, Antler Profile, Behavior Breakdown & Sighting Log
  # ============================================================================
  - type: vertical-stack
    cards:
      # 1. Navigation & Buck Identity Card
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:button-card
            name: "← Back to Buck Registry & Hit-List"
            icon: mdi:arrow-left-bold-circle-outline
            show_name: true
            show_icon: true
            tap_action:
              action: navigate
              navigation_path: /lovelace/buck-registry
            styles:
              card:
                - border-radius: 12px 12px 0 0
                - padding: 10px 16px
                - background: rgba(243, 156, 18, 0.16)
                - border-bottom: 1px solid rgba(243, 156, 18, 0.35)
                - cursor: pointer
              icon:
                - color: "#f39c12"
                - width: 20px
                - height: 20px
              name:
                - font-size: 14px
                - font-weight: 700
                - color: "#f39c12"
                - text-align: left
              grid:
                - grid-template-columns: 28px 1fr
                - grid-template-areas: "'i n'"
          - type: picture-entity
            entity: camera.stealthcam_buck_profile_<slot>
            show_name: false
            show_state: false
          - type: markdown
            content: |
              {% set a = states.camera.stealthcam_buck_profile_<slot>.attributes if states.camera.stealthcam_buck_profile_<slot> is defined else {} %}
              ## 🦌 {{ a.get('buck_name', 'Buck Profile') }} — <span style="color: #f39c12;">{{ a.get('points', 'Unknown') }}</span>
              - 📐 **Beam Spread:** `{{ a.get('beam_spread', 'Unknown') }}`  •  🎂 **Est. Age:** `{{ a.get('age_estimate', 'Unknown') }}`
              - 📍 **Last Seen:** <b style="color: #2ecc71;">{{ a.get('last_seen_formatted', 'N/A') }}</b> at **{{ a.get('last_seen_stand', 'N/A') }}**
              - 🗺️ **GPS Location:** `{{ a.get('latitude') }}, {{ a.get('longitude') }}` (`{{ a.get('heading', 'N/A') }}`)
              - 🗓️ **First Sighting:** `{{ a.get('first_seen_formatted', 'N/A') }}`
              - 🎯 **Total Sightings:** **{{ a.get('sightings_count', 0) }} Unique Sightings** (`{{ a.get('total_photos_count', 0) }}` archived burst photos)
              - 📝 **Antler & Physical Notes:** *{{ a.get('antler_notes', '') }}*

      # 2. Tactical GPS Camera Movement & Travel Corridor Vector Map (Dynamic SVG)
      - type: custom:button-card
        entity: camera.stealthcam_buck_profile_<slot>
        show_icon: false
        show_name: true
        show_label: true
        name: "[[[ return '🗺️ ' + (entity.attributes.buck_name || 'Buck') + ' — GPS Camera Movement & Corridor Map'; ]]]"
        label: |
          [[[
            var a = entity.attributes || {};
            var stands = a.stands_gps || {};
            var sb = a.stand_breakdown || {};
            var wps = a.movement_waypoints || [];
            var vecs = a.movement_vectors || [];
            var lastStand = a.last_seen_stand || '';
            var standNames = Object.keys(stands).filter(function(k) {
              return stands[k] && stands[k].latitude != null && stands[k].longitude != null;
            });
            if (standNames.length === 0) return '<div style="padding:12px;color:#aaa;">Waiting for GPS coordinates...</div>';
            var lats = standNames.map(function(k) { return Number(stands[k].latitude); });
            var lons = standNames.map(function(k) { return Number(stands[k].longitude); });
            var minLat = Math.min.apply(null, lats), maxLat = Math.max.apply(null, lats);
            var minLon = Math.min.apply(null, lons), maxLon = Math.max.apply(null, lons);
            var latSpan = Math.max(maxLat - minLat, 0.0025), lonSpan = Math.max(maxLon - minLon, 0.0040);
            minLat -= latSpan * 0.22; maxLat += latSpan * 0.22;
            minLon -= lonSpan * 0.20; maxLon += lonSpan * 0.20;
            var W = 540, H = 320;
            function toX(lon) { return Math.round(36 + ((Number(lon) - minLon) / (maxLon - minLon)) * (W - 72)); }
            function toY(lat) { return Math.round(H - 34 - ((Number(lat) - minLat) / (maxLat - minLat)) * (H - 68)); }
            var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;background:radial-gradient(circle at 50% 50%, #16241c 0%, #0d1511 100%);border-radius:10px;border:1px solid rgba(46,204,113,0.3);display:block;">';
            svg += '<defs><marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#2ecc71"/></marker></defs>';
            vecs.forEach(function(v) {
              if (v.from_lat != null && v.to_lat != null) {
                var x1 = toX(v.from_lon), y1 = toY(v.from_lat), x2 = toX(v.to_lon), y2 = toY(v.to_lat);
                var dx = x2 - x1, dy = y2 - y1, len = Math.sqrt(dx * dx + dy * dy) || 1;
                var sx = Math.round(x1 + (dx / len) * 18), sy = Math.round(y1 + (dy / len) * 18);
                var ex = Math.round(x2 - (dx / len) * 20), ey = Math.round(y2 - (dy / len) * 20);
                var mx = Math.round((sx + ex) / 2 - (dy / len) * 16), my = Math.round((sy + ey) / 2 + (dx / len) * 16);
                svg += '<path d="M ' + sx + ' ' + sy + ' Q ' + mx + ' ' + my + ' ' + ex + ' ' + ey + '" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arrowGreen)"/>';
                var lbl = (v.distance_yards ? v.distance_yards + ' yds' : '') + (v.elapsed_label ? ' (' + v.elapsed_label + ')' : '');
                svg += '<rect x="' + (mx - 52) + '" y="' + (my - 10) + '" width="104" height="16" rx="4" fill="rgba(0,0,0,0.82)" stroke="#2ecc71" stroke-width="1"/>';
                svg += '<text x="' + mx + '" y="' + (my + 1) + '" fill="#2ecc71" font-size="9.5" font-weight="700" text-anchor="middle">' + lbl + '</text>';
              }
            });
            standNames.forEach(function(st) {
              var info = stands[st], x = toX(info.longitude), y = toY(info.latitude);
              var hits = sb[st] || 0, isLast = (st === lastStand), isVisited = (hits > 0);
              var fillCol = isLast ? '#f39c12' : (isVisited ? '#2ecc71' : 'rgba(255,255,255,0.12)');
              var r = isLast ? 14 : (isVisited ? 12 : 8);
              svg += '<circle cx="' + x + '" cy="' + y + '" r="' + r + '" fill="' + fillCol + '" stroke="#fff" stroke-width="1.5"/>';
              if (isVisited) svg += '<text x="' + x + '" y="' + (y + 4) + '" fill="#000" font-size="11" font-weight="900" text-anchor="middle">' + hits + 'x</text>';
              svg += '<text x="' + x + '" y="' + (y + r + 13) + '" fill="' + (isLast ? '#f39c12' : (isVisited ? '#2ecc71' : '#888')) + '" font-size="10.5" font-weight="800" text-anchor="middle">' + st + '</text>';
            });
            svg += '</svg>';
            return svg;
          ]]]
        styles:
          card:
            - border-radius: 12px
            - padding: 12px
            - border: 1px solid rgba(46, 204, 113, 0.35)
          name:
            - font-size: 15px
            - font-weight: 800
            - color: "#2ecc71"
            - text-align: left
            - padding-bottom: 8px
            - width: 100%
          label:
            - width: 100%

      # 3. Behavioral Breakdown & Environmental Preferences
      - type: markdown
        title: "🧭 Behavior & Movement Breakdown"
        content: |
          {% set a = states.camera.stealthcam_buck_profile_<slot>.attributes if states.camera.stealthcam_buck_profile_<slot> is defined else {} %}
          {% set wb = a.get('window_breakdown', {}) %}
          {% set sb = a.get('stand_breakdown', {}) %}
          {% set corridors = a.get('travel_corridors', []) %}
          ### ⏰ Time-of-Day Activity ({{ a.get('daylight_pct', 0) }}% Daylight)
          - 🏆 **Preferred Window:** <b style="color: #f39c12;">{{ a.get('preferred_window', 'Night') }}</b>
          - 🌅 **Dawn (5–9 AM):** `{{ wb.get('Dawn', 0) }} sightings`
          - ☀️ **Midday (9 AM–5 PM):** `{{ wb.get('Midday', 0) }} sightings`
          - 🌇 **Dusk (5–9 PM):** `{{ wb.get('Dusk', 0) }} sightings`
          - 🌙 **Night (9 PM–5 AM):** `{{ wb.get('Night', 0) }} sightings`

          ---

          ### 📍 Camera Stand Frequency
          - ⭐ **Primary Core Stand:** <b style="color: #2ecc71;">{{ a.get('favorite_stand', 'N/A') }}</b>
          {% for st, cnt in sb.items() %}- 📷 **{{ st }}:** `{{ cnt }} sighting{{ 's' if cnt != 1 else '' }}`
          {% endfor %}

          {% if corridors | length > 0 %}
          ---

          ### 🛤️ Verified Stand-to-Stand Travel Corridors
          {% for c in corridors %}- 🧭 <b style="color: #2ecc71;">{{ c }}</b>
          {% endfor %}
          {% endif %}

          ---

          ### 🌤️ Weather & Barometric Trigger Profile
          - 🌡️ **Average Movement Temp:** `{{ a.get('avg_temp', 'N/A') }}°F` (Last seen at `{{ a.get('last_seen_temp', 'N/A') }}°F`)
          - 📈 **Average Barometer:** `{{ a.get('avg_pressure', 'N/A') }} inHg` ({{ a.get('last_seen_pressure_tendency', 'Steady') }})
          - 💨 **Preferred Wind Direction:** `{{ a.get('preferred_wind', 'Variable') }}` (Last: `{{ a.get('last_seen_wind', 'Calm') }}`)
          - 🌔 **Last Moon Phase:** `{{ a.get('last_seen_moon', 'N/A') }}`

      # 3. Last Seen GPS Map (Uses latitude & longitude on camera.stealthcam_buck_profile_<slot>)
      - type: map
        title: "🗺️ Last Seen Camera GPS Position"
        default_zoom: 17
        hours_to_show: 24
        entities:
          - camera.stealthcam_buck_profile_<slot>

      # 4. Chronological Sighting History Table
      - type: markdown
        title: "📋 Deduplicated Sighting Log"
        content: |
          {% set a = states.camera.stealthcam_buck_profile_<slot>.attributes if states.camera.stealthcam_buck_profile_<slot> is defined else {} %}
          {% set logs = a.get('movement_log', []) %}
          <table style="width: 100%; border-collapse: collapse; margin-top: 6px;">
            <tr style="background: rgba(255, 255, 255, 0.08); border-bottom: 1px solid rgba(255, 255, 255, 0.15);">
              <th style="padding: 6px; text-align: left;">Date / Time</th>
              <th style="padding: 6px; text-align: left;">Stand</th>
              <th style="padding: 6px; text-align: center;">Burst</th>
              <th style="padding: 6px; text-align: left;">Weather</th>
              <th style="padding: 6px; text-align: left;">HD Status</th>
            </tr>
            {% for m in logs %}
            <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
              <td style="padding: 6px;"><code>{{ m.time_formatted }}</code><br><small style="color: #aaa;">{{ m.time_window }}</small></td>
              <td style="padding: 6px;"><b style="color: #f39c12;">{{ m.stand }}</b></td>
              <td style="padding: 6px; text-align: center;"><code>{{ m.burst_count }} pics</code></td>
              <td style="padding: 6px; font-size: 12px;">{{ m.temperature }}°F • {{ m.wind }}<br><small style="color: #aaa;">{{ m.pressure }} inHg ({{ m.pressure_tendency }})</small></td>
              <td style="padding: 6px; font-size: 11px;"><code>{{ m.hd_status }}</code></td>
            </tr>
            {% endfor %}
          </table>

  # ============================================================================
  # Right Column: Complete Photo Vault Gallery for This Buck
  # ============================================================================
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          {% set a = states.camera.stealthcam_buck_profile_<slot>.attributes if states.camera.stealthcam_buck_profile_<slot> is defined else {} %}
          ### 📸 All Captured Photos of **{{ a.get('buck_name', 'This Buck') }}** (`{{ a.get('total_photos_count', 0) }}` Photos Archived in `/media/stealthcam_bucks/`)
          *Tap any photo card below to open the full-resolution zoomable camera dialog.*
      - type: custom:auto-entities
        card:
          type: custom:layout-card
          layout_type: custom:grid-layout
          layout:
            grid-template-columns: repeat(3, 1fr)
            grid-gap: 12px
            margin: 0px
            mediaquery:
              "(max-width: 950px)":
                grid-template-columns: repeat(2, 1fr)
                grid-gap: 8px
        filter:
          include:
            - entity_id: "camera.stealthcam_buck_<slot>_photo_*"
              attributes:
                active: true
              options:
                type: custom:button-card
                entity: this.entity_id
                show_entity_picture: true
                show_name: true
                show_label: true
                entity_picture: "[[[ return entity.attributes.entity_picture; ]]]"
                name: "[[[ return '📍 ' + (entity.attributes.stand || '') + ' • ' + (entity.attributes.time_str || 'Capture'); ]]]"
                label: |
                  [[[
                    var a = entity.attributes;
                    var hd = a.is_hd ? '🌟 FULL HD' : ('📡 HD: ' + (a.hq_photo_status || 'Pending'));
                    var wx = (a.temperature ? a.temperature + '°F' : '') + (a.wind_cardinal ? ' • 💨 ' + a.wind_cardinal : '');
                    return hd + (wx ? ' • ' + wx : '');
                  ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 10px
                    - padding: 0
                    - overflow: hidden
                    - border: 2px solid #f39c12
                    - box-shadow: 0 0 12px rgba(243, 156, 18, 0.35)
                    - background: var(--card-background-color, #1c1c1e)
                    - cursor: pointer
                  entity_picture:
                    - width: 100%
                    - height: 185px
                    - object-fit: cover
                    - background: "#000"
                  name:
                    - font-size: 13px
                    - font-weight: 700
                    - color: "#fff"
                    - padding: 8px 10px 2px 10px
                    - text-align: left
                  label:
                    - font-size: 11px
                    - font-weight: 700
                    - color: "#f39c12"
                    - padding: 0px 10px 8px 10px
                    - text-align: left
