# ==============================================================================
# Stealth Cam Command - Camera Deep-Dive & 36-Photo Subview Template
# Replace <camera_slug> with your camera slug (e.g. homer, maggie, bart)
# ==============================================================================

title: Camera Deep Dive
path: stand-<camera_slug>
subview: true
type: custom:grid-layout
layout:
  grid-template-columns: 380px 1fr
  grid-gap: 16px
  mediaquery:
    "(max-width: 950px)":
      grid-template-columns: 100%
cards:
  # ============================================================================
  # Left Column: Navigation, Activity & Movement Intel, and GPS Map
  # ============================================================================
  - type: vertical-stack
    cards:
      # 1. Navigation Header
      - type: markdown
        content: |
          ## 🦌 Stand Intelligence & Photo Reel
          **Position:** {{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_stand_location') }}
          
          [⬅️ Return to Trail Cams Hub](/lovelace/trail-cams)

      # 2. Activity & Movement Trends
      - type: markdown
        title: "📊 Activity & Trends"
        content: |
          ### 🦌 Deer & Wildlife Intelligence
          - 🦌 <b style="color: #f39c12;">Verified Bucks:</b> `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_positive_buck_hits') }} hits`
          - 🐾 <b style="color: #3498db;">Verified Does:</b> `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'doe_hits_count') | default(0) }} hits`
          - 🚨 <b style="color: #e74c3c;">Human Activity:</b> `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'person_hits_count') | default(0) }} detections`
          - 🎯 **Last Hit:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit') }}`
          - ⏰ **Peak Window:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_peak_movement_window') }}`

          ---

          ### ⏱️ 24-Hour Movement ({{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'captures_24h') | default(0) }} Captures)
          - 🌅 **Dawn (5–9 AM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'morning_24h') | default(0) }} hits`
          - ☀️ **Midday (9 AM–4 PM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'midday_24h') | default(0) }} hits`
          - 🌇 **Evening (4–8 PM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'evening_24h') | default(0) }} hits`
          - 🌙 **Night (8 PM–5 AM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'night_24h') | default(0) }} hits`

          ---

          ### 📊 All-Time Movement ({{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'total_analyzed_captures') | default(0) }} Captures)
          - 🌅 **Dawn (5–9 AM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'morning_hits') | default(0) }} hits`
          - ☀️ **Midday (9 AM–4 PM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'midday_hits') | default(0) }} hits`
          - 🌇 **Evening (4–8 PM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'evening_hits') | default(0) }} hits`
          - 🌙 **Night (8 PM–5 AM):** `{{ state_attr('sensor.stealth_cam_<camera_slug>_<camera_slug>_last_animal_hit', 'night_hits') | default(0) }} hits`

          ---

          ### 🌤️ Weather & Status
          - 🌡️ **Temp:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_field_temperature') }}°F`  •  **Baro:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_barometric_pressure') }} inHg`
          - 💨 **Wind:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_field_wind') }}`  •  **Moon:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_moon_phase') }}`
          - 🔋 **Battery:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_battery') }}%`  •  **Signal:** `{{ states('sensor.stealth_cam_<camera_slug>_<camera_slug>_cellular_signal') }}`

      # 3. Zoomed Camera GPS Map (Positioned directly below Activity Trends)
      - type: map
        title: "🗺️ Stand Camera Position"
        default_zoom: 18
        hours_to_show: 1
        entities:
          - "sensor.stealth_cam_<camera_slug>_<camera_slug>_stand_location"

  # ============================================================================
  # Right Column: Double-Width Spacious 36-Photo Reel & Filter Bar
  # ============================================================================
  - type: vertical-stack
    cards:
      - type: markdown
        content: |
          ### 📸 Photo Reel (Latest 36 Captures)
          *Captures are sorted chronologically with newest first.*
      - type: custom:auto-entities
        card:
          type: grid
          columns: 3
          square: false
        filter:
          include:
            - entity_id: "camera.stealth_cam_<camera_slug>_<camera_slug>_photo_*"
              options:
                type: custom:button-card
                entity: this.entity_id
                show_entity_picture: true
                show_name: true
                show_label: true
                name: "[[[ return entity.attributes.time_str || 'Recent Capture'; ]]]"
                entity_picture: "[[[ return entity.attributes.thumbnail_url || entity.attributes.image_url; ]]]"
                label: |
                  [[[
                    var tag = entity.attributes.tag || '';
                    if (entity.attributes.is_buck || tag === 'buck') return '✨ 🦌 VERIFIED BUCK';
                    if (entity.attributes.is_doe || tag === 'doe') return '🦌 VERIFIED DOE';
                    if (entity.attributes.is_person || tag === 'person') return '🚨 👤 HUMAN ACTIVITY';
                    return '🔍 Tap for Photo';
                  ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - border-radius: 10px
                    - padding: 0
                    - overflow: hidden
                    - border: |
                        [[[
                          var tag = entity.attributes.tag || '';
                          if (entity.attributes.is_buck || tag === 'buck') return '2.5px solid #f39c12';
                          if (entity.attributes.is_doe || tag === 'doe') return '2.5px solid #3498db';
                          if (entity.attributes.is_person || tag === 'person') return '2.5px solid #e74c3c';
                          return '1.5px solid rgba(82, 148, 226, 0.35)';
                        ]]]
                    - box-shadow: |
                        [[[
                          var tag = entity.attributes.tag || '';
                          if (entity.attributes.is_buck || tag === 'buck') return '0 0 14px rgba(243, 156, 18, 0.55)';
                          if (entity.attributes.is_doe || tag === 'doe') return '0 0 14px rgba(52, 152, 219, 0.55)';
                          if (entity.attributes.is_person || tag === 'person') return '0 0 14px rgba(231, 76, 60, 0.65)';
                          return 'none';
                        ]]]
                    - background: var(--card-background-color, #1c1c1e)
                    - cursor: pointer
                  entity_picture:
                    - width: 100%
                    - height: 160px
                    - object-fit: cover
                    - background: "#000"
                  name:
                    - font-size: 13px
                    - font-weight: 700
                    - color: "#fff"
                    - padding: 6px 8px 0px 8px
                    - text-align: left
                  label:
                    - font-size: 11px
                    - font-weight: 700
                    - color: |
                        [[[
                          var tag = entity.attributes.tag || '';
                          if (entity.attributes.is_buck || tag === 'buck') return '#f39c12';
                          if (entity.attributes.is_doe || tag === 'doe') return '#3498db';
                          if (entity.attributes.is_person || tag === 'person') return '#e74c3c';
                          return '#70a5eb';
                        ]]]
                    - padding: 2px 8px 6px 8px
                    - text-align: left
