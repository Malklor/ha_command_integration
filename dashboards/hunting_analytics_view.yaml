            </tr>
            <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
              <td style="padding: 8px;">🌤️ <b>60–70°F (Crepuscular Limit)</b></td>
              <td style="padding: 8px; text-align: center;"><code>30 (15%)</code></td>
              <td style="padding: 8px; text-align: center; color: #f39c12;"><b>2 Bucks</b></td>
              <td style="padding: 8px; text-align: center; color: #3498db;"><b>6 Does</b></td>
              <td style="padding: 8px;"><span style="color: #e67e22; font-weight: 700;">Moderate</span> — Movement strictly compressed to last 30 min daylight</td>
