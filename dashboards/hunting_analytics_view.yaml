              <th style="padding: 8px; text-align: center;">Captures</th>
              <th style="padding: 8px; text-align: center;">Verified Bucks</th>
              <th style="padding: 8px; text-align: center;">Verified Does</th>
              <th style="padding: 8px; text-align: left;">Activity Level & Behavioral Sweet Spot</th>
            </tr>
            <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
              <td style="padding: 8px;">❄️ <b>&lt;40°F (Frost/Cold Snap)</b></td>
              <td style="padding: 8px; text-align: center;"><code>24 (12%)</code></td>
              <td style="padding: 8px; text-align: center; color: #f39c12;"><b>5 Bucks</b></td>
