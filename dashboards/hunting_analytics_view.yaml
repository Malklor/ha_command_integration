              <td style="padding: 8px; text-align: center; color: #3498db;"><b>19 Does</b></td>
              <td style="padding: 8px;"><span style="color: #2ecc71; font-weight: 700;">MAXIMUM PRIME</span> — Peak daytime corridor cruising & buck seeking</td>
