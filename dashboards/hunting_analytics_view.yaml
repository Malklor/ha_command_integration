# ==============================================================================
# Stealth Cam Command - Deep Wildlife Analytics & 5-Day Solunar Forecast View
# Dashboard Path: /lovelace/hunting-analytics
# ==============================================================================

title: Hunting Analytics
path: hunting-analytics
icon: mdi:crystal-ball
cards:
  # 1. Navigation & Executive Prime Pick Header
  - type: custom:vertical-stack-in-card
    cards:
      - type: custom:button-card
        name: "← Back to Trail Cams Main Hub"
        icon: mdi:arrow-left-bold-circle-outline
        show_name: true
        show_icon: true
        tap_action:
          action: navigate
          navigation_path: /lovelace/trail-cams
        styles:
          card:
            - border-radius: 12px 12px 0 0
            - padding: 10px 16px
            - background: rgba(82, 148, 226, 0.15)
            - border-bottom: 1px solid rgba(82, 148, 226, 0.3)
            - cursor: pointer
          icon:
            - color: var(--primary-color, #5294e2)
            - width: 20px
            - height: 20px
          name:
            - font-size: 14px
            - font-weight: 700
            - color: var(--primary-color, #5294e2)
            - text-align: left
          grid:
            - grid-template-columns: 28px 1fr
            - grid-template-areas: "'i n'"
      - type: markdown
        content: |
          ## 🧭 Deep Wildlife Analytics & Predictive Hunting Intel
          *Correlating 200+ Trail Cam Captures, Future Weather Forecasts, Solunar Moon Phases & Stand Scent Headings*

          ---

          {% set top_rec = state_attr('sensor.stealthcam_predictive_hunt_forecast', 'top_recommendation') or {} %}
          ### 🏆 **#1 Prime Hunt Window This Week: {{ top_rec.get('day', 'Upcoming') }} • {{ top_rec.get('window', 'Dawn') }}**
          - 🎯 **Recommended Stand:** <b style="color: #f39c12; font-size: 16px;">{{ top_rec.get('stand', 'LISA') }}</b>  •  **Rating:** <b style="color: #2ecc71;">{{ top_rec.get('rating', '⭐⭐⭐⭐⭐ Prime') }} ({{ top_rec.get('score', 100) }}/100)</b>
          - 🌡️ **Target Temp:** `{{ top_rec.get('temp', '53°F') }}`  •  🧭 **Wind:** `{{ top_rec.get('wind', '10 mph WNW') }}`  •  🌔 **Moon:** `{{ top_rec.get('moon_phase', '🌘 Waning Crescent') }}`
          - 💡 **Tactical Rationale:** *{{ top_rec.get('note', 'Cold snap front combined with favorable headwind corridor creates prime daylight buck movement.') }}*

  # 2. 5-Day Solunar & Weather Hunting Forecast Card
  - type: custom:vertical-stack-in-card
    cards:
      - type: markdown
        title: "🔮 5-Day Solunar & Weather Hunting Forecast"
        content: |
          {% set days = state_attr('sensor.stealthcam_predictive_hunt_forecast', 'forecast_days') or [] %}
          {% if days | length == 0 %}
          *Forecast data is updating from weather service...*
          {% else %}
          {% for d in days %}
          ### 📅 **{{ d.date_formatted }} ({{ d.day_name }})** — {{ d.moon_icon }} {{ d.moon_phase }} • {{ d.temp_high }}°F / {{ d.temp_low }}°F • 💨 {{ d.wind_speed }} mph {{ d.wind_cardinal }}
          {% if d.cold_snap %}
          <div style="background: rgba(52, 152, 219, 0.2); border-left: 4px solid #3498db; padding: 6px 10px; margin: 6px 0; border-radius: 4px;">❄️ <b>COLD FRONT ALERT:</b> <b>{{ d.temp_change }}°F</b> drop expected! Cold snaps trigger major daylight buck movement and scrape visits.</div>
          {% endif %}
          <table style="width: 100%; border-collapse: collapse; margin-top: 6px; margin-bottom: 14px;">
            <tr style="background: rgba(255, 255, 255, 0.05); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
              <th style="padding: 6px 8px; text-align: left;">Window</th>
              <th style="padding: 6px 8px; text-align: left;">Best Stand</th>
              <th style="padding: 6px 8px; text-align: left;">Rating</th>
              <th style="padding: 6px 8px; text-align: left;">Temp / Scent</th>
              <th style="padding: 6px 8px; text-align: left;">Tactical Intel</th>
            </tr>
            <tr style="border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
              <td style="padding: 6px 8px;"><b>{{ d.morning_hunt.window_name }}</b></td>
              <td style="padding: 6px 8px;"><b style="color: #f39c12;">{{ d.morning_hunt.best_stand }}</b></td>
              <td style="padding: 6px 8px;"><code>{{ d.morning_hunt.score }}/100</code> <span style="font-size: 11px;">{{ d.morning_hunt.rating }}</span></td>
              <td style="padding: 6px 8px;">{{ d.morning_hunt.target_temp }}<br><small>{{ d.morning_hunt.wind_status }}</small></td>
              <td style="padding: 6px 8px; font-size: 12px; color: #ccc;">{{ d.morning_hunt.tactical_note }}</td>
            </tr>
            <tr>
              <td style="padding: 6px 8px;"><b>{{ d.evening_hunt.window_name }}</b></td>
              <td style="padding: 6px 8px;"><b style="color: #f39c12;">{{ d.evening_hunt.best_stand }}</b></td>
              <td style="padding: 6px 8px;"><code>{{ d.evening_hunt.score }}/100</code> <span style="font-size: 11px;">{{ d.evening_hunt.rating }}</span></td>
              <td style="padding: 6px 8px;">{{ d.evening_hunt.target_temp }}<br><small>{{ d.evening_hunt.wind_status }}</small></td>
              <td style="padding: 6px 8px; font-size: 12px; color: #ccc;">{{ d.evening_hunt.tactical_note }}</td>
            </tr>
          </table>
          {% endfor %}
          {% endif %}

